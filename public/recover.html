<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Récupérer mon espace — OUTLAW MORDREX</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">OUTLAW <span>MORDREX</span></div>
  <nav><a href="/index.html">Accueil</a></nav>
</div>

<div class="wrap">
  <h1 class="section-title" style="margin-top:24px;">Récupérer mon espace</h1>
  <p class="muted" style="margin-bottom:18px;">Entre ton numéro de participant et ton code de récupération (affiché dans "Mon espace" lors de ta première inscription).</p>

  <form id="recover-form" class="panel">
    <div class="field">
      <label>Numéro de participant (ex. 12 ou #012)</label>
      <input type="text" id="f-number" required placeholder="12">
    </div>
    <div class="field">
      <label>Code de récupération</label>
      <input type="text" id="f-code" required placeholder="AB12-CD34">
    </div>
    <button type="submit" class="btn btn-primary" id="submit-btn">ACCÉDER À MON ESPACE</button>
  </form>
</div>

<script src="/js/api.js"></script>
<script>
document.getElementById('recover-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'VÉRIFICATION…';
  const rawNumber = document.getElementById('f-number').value.trim().replace('#', '');
  const code = document.getElementById('f-code').value.trim();
  try {
    await api('/api/participants/recover', {
      method: 'POST',
      body: JSON.stringify({ participantNumber: rawNumber, recoveryCode: code }),
    });
    toast('Espace retrouvé !', 'success');
    window.location.href = '/space.html';
  } catch (err) {
    btn.disabled = false; btn.textContent = 'ACCÉDER À MON ESPACE';
    toast(err.message, 'error');
  }
});
</script>
</body>
</html>
