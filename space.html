<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon espace — OUTLAW MORDREX</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">OUTLAW <span>MORDREX</span></div>
  <nav>
    <a href="/participants.html">Participants</a>
    <a href="/leaderboard.html">Classement</a>
  </nav>
</div>

<div class="wrap" id="content">
  <div class="skeleton" style="height:200px;margin-top:20px;"></div>
</div>

<script src="/js/api.js"></script>
<script>
(async function () {
  const content = document.getElementById('content');
  let me;
  try {
    me = await api('/api/participants/me');
  } catch (e) {
    window.location.href = '/rewards.html';
    return;
  }

  const link = `${window.location.origin}/ref/${me.referralCode}`;

  content.innerHTML = `
    <h1 class="section-title" style="margin-top:22px;">Mon espace</h1>

    <div class="space-header">
      ${avatarHtml(me.profileImage, me.name, 62)}
      <div>
        <h2>${escapeHtml(me.name)}</h2>
        <span class="pnum">PARTICIPANT #${String(me.number).padStart(3, '0')}</span>
      </div>
    </div>

    ${me.description ? `<p class="muted" style="margin:-12px 0 18px;">${escapeHtml(me.description)}</p>` : ''}

    <div class="panel">
      ${me.reward ? `
        <p class="muted" style="margin:0 0 4px;">Récompense visée</p>
        <h3 style="margin:0 0 14px;font-size:17px;">${escapeHtml(me.reward.name)}</h3>
      ` : '<p class="muted">Aucune récompense associée.</p>'}

      <div class="coin-display">
        <div class="amount">${me.coins}<small> / ${me.reward ? me.reward.requiredCoins : '—'} coins</small></div>
      </div>
      ${me.reward ? `
        <div class="progress-track"><div class="progress-fill" style="width:${me.reward.progress}%;"></div></div>
        <p class="muted center">${me.reward.progress}%</p>
        ${me.reward.objectiveReached ? '<p class="center" style="color:var(--success);font-weight:700;margin-top:10px;">OBJECTIF ATTEINT ✓</p>' : ''}
      ` : ''}
    </div>

    <h3 class="section-title" style="font-size:17px;">Mon lien de parrainage</h3>
    <p class="muted" style="margin-top:-8px;">Chaque personne inscrite grâce à ton lien te rapporte des coins.</p>
    <div class="referral-box">${link}</div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="btn btn-outline btn-sm" id="copy-btn" style="flex:1;">COPIER LE LIEN</button>
      <button class="btn btn-gold btn-sm" id="share-btn" style="flex:1;">PARTAGER</button>
    </div>
    <p class="muted">${me.referralsCount} parrainage(s) validé(s)</p>

    <details style="margin:20px 0;">
      <summary class="muted" style="cursor:pointer;">Code de récupération (à garder secret)</summary>
      <div class="referral-box" style="margin-top:10px;">${escapeHtml(me.recoveryCode)}</div>
      <p class="muted">Utilise ce code avec ton numéro #${String(me.number).padStart(3, '0')} pour retrouver ton espace sur un autre appareil, depuis la page <a href="/recover.html" style="color:var(--brass);text-decoration:underline;">Récupérer mon espace</a>.</p>
    </details>

    <h3 class="section-title" style="font-size:17px;">Activité</h3>
    <div class="panel" style="padding:6px 14px;" id="history"></div>
  `;

  const historyEl = document.getElementById('history');
  if (me.history.length === 0) {
    historyEl.innerHTML = '<p class="muted" style="padding:14px 0;">Aucune activité pour le moment.</p>';
  } else {
    historyEl.innerHTML = me.history.map((h) => `
      <div class="history-item">
        <div>
          <div>${escapeHtml(h.reason)}</div>
          <div class="when">${formatDateTime(h.createdAt)}</div>
        </div>
        <div class="amt ${h.amount >= 0 ? 'pos' : 'neg'}">${h.amount >= 0 ? '+' : ''}${h.amount}</div>
      </div>
    `).join('');
  }

  document.getElementById('copy-btn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(link);
      toast('Lien copié !', 'success');
    } catch (e) {
      toast('Impossible de copier automatiquement — copie le lien manuellement.', 'error');
    }
  });

  document.getElementById('share-btn').addEventListener('click', () => {
    const text = `Rejoins le giveaway OUTLAW MORDREX avec mon lien : ${link}`;
    if (navigator.share) {
      navigator.share({ title: 'OUTLAW MORDREX', text, url: link }).catch(() => {});
    } else {
      window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
    }
  });
})();
</script>
</body>
</html>
