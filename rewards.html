<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Récompenses — OUTLAW MORDREX</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">OUTLAW <span>MORDREX</span></div>
  <nav>
    <a href="/index.html">Accueil</a>
    <a href="/participants.html">Participants</a>
    <a href="/leaderboard.html">Classement</a>
  </nav>
</div>

<div class="wrap">
  <h1 class="section-title" style="margin-top:24px;">Les récompenses</h1>
  <p class="muted" style="margin-bottom:18px;">Choisis la récompense que tu vises. Ton profil de participant y sera rattaché.</p>
  <div id="list">
    <div class="flow-note panel" style="margin-bottom:14px;"><strong>COMMENT PARTICIPER ?</strong><p class="muted" style="margin:6px 0 0;">Choisis une récompense → ouvre sa fiche → clique sur « Participer à cette récompense » → remplis ton nom et ton numéro.</p></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script>
(async function () {

  try {
    const rewards = await api('/api/rewards');
    const list = document.getElementById('list');
    if (rewards.length === 0) {
      list.innerHTML = '<div class="empty-state"><div class="icon">🎯</div><strong>Aucune récompense configurée.</strong><p class="muted">L’administrateur doit d’abord créer les récompenses dans le panneau Admin.</p><a class="btn btn-outline" href="/admin/">OUVRIR LE PANNEAU ADMIN</a></div>';
      return;
    }
    list.innerHTML = rewards.map((r, i) => `
      <a class="panel reward-card" href="/reward.html?id=${encodeURIComponent(r.id)}">
        ${r.image ? `<img class="reward-thumb" src="${escapeHtml(r.image)}" alt="">` : `<div class="reward-thumb">#${i + 1}</div>`}
        <div class="reward-info">
          <div class="num">RÉCOMPENSE #${i + 1}</div>
          <h3>${escapeHtml(r.name)}</h3>
          <p>${escapeHtml(r.description || 'Aucune description.')}</p><span class="muted">${r.participantsCount} joueur(s) déjà inscrit(s)</span>
        </div>
        <div class="coin-tag">${r.requiredCoins}<br><span style="font-family:'Work Sans';font-size:10px;color:var(--muted);">COINS</span></div>
      </a>
    `).join('');
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="empty-state">Impossible de charger les récompenses.</div>';
  }
})();
</script>
</body>
</html>
